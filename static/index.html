<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MLL Gateway</title>
<style>
:root {
  --bg: #FFFFFF;
  --sidebar: #FAFAFA;
  --surface: #F5F5F5;
  --surface-2: #EDEDED;
  --text: #18181B;
  --text2: #71717A;
  --border: #E4E4E7;
  --accent: #18181B;
  --accent-contrast: #FFFFFF;
  --danger: #B42318;
  --ok: #15803D;
  --radius: 6px;
  --radius-lg: 8px;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111112;
    --sidebar: #161617;
    --surface: #1C1C1E;
    --surface-2: #242427;
    --text: #ECECEC;
    --text2: #8E8E93;
    --border: #2A2A2D;
    --accent: #EDEDED;
    --accent-contrast: #111112;
    --danger: #F1736B;
    --ok: #4ADE80;
  }
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font: 400 14px/1.5 "SF Pro Text", "PingFang SC", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
input, select, textarea { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 5px 9px; outline: none; }
input:focus, select:focus, textarea:focus { border-color: var(--text2); }
[hidden] { display: none !important; }

/* 桌面应用外壳 */
.app { display: flex; height: 100vh; height: 100dvh; }

.sidebar {
  width: 204px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  padding: 12px 10px;
  background: var(--sidebar);
  border-right: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 8px; padding: 6px 8px 16px; font-weight: 600; font-size: 13px; }
.brand .mark { width: 14px; height: 14px; border-radius: 4px; background: var(--text); }
nav { display: flex; flex-direction: column; gap: 2px; }
nav button {
  display: flex; align-items: center; gap: 8px;
  width: 100%; padding: 7px 9px; border: none; border-radius: var(--radius);
  background: none; color: var(--text2); font-size: 13px; font-weight: 500; text-align: left;
}
nav button svg { flex-shrink: 0; opacity: .85; }
nav button:hover { background: var(--surface); color: var(--text); }
nav button.active { background: var(--surface-2); color: var(--text); }
.side-foot {
  margin-top: auto; display: flex; align-items: center; gap: 6px;
  padding: 10px 8px 4px; border-top: 1px solid var(--border);
  font-family: var(--mono); font-size: 11px; color: var(--text2);
}
.side-foot .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); flex-shrink: 0; }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.titlebar {
  height: 46px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; border-bottom: 1px solid var(--border);
}
.titlebar h1 { font-size: 13px; font-weight: 600; }
.titlebar .tb-meta { font-family: var(--mono); font-size: 11.5px; color: var(--text2); }

/* Electron 窗口：让出 macOS 红绿灯位置，并支持拖动窗口 */
body.is-electron .sidebar { padding-top: 38px; }
body.is-electron .brand { -webkit-app-region: drag; }
body.is-electron .titlebar { -webkit-app-region: drag; }
body.is-electron .titlebar button,
body.is-electron .titlebar select { -webkit-app-region: no-drag; }

.content { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.content > section { flex: 1; min-height: 0; }

/* 控制条 */
.controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.controls label.field { display: inline-flex; align-items: center; gap: 7px; color: var(--text2); font-size: 12.5px; }
.controls select { min-width: 112px; }
.chip-btn { border: 1px solid var(--border); background: var(--bg); border-radius: var(--radius); padding: 5px 11px; color: var(--text2); font-size: 12.5px; }
.chip-btn:hover { color: var(--text); }
.chip-btn.on { background: var(--surface-2); border-color: transparent; color: var(--text); }
.switch-row { display: inline-flex; align-items: center; gap: 7px; margin-left: auto; color: var(--text2); font-size: 12.5px; cursor: pointer; }
.switch-row input { display: none; }
.switch { width: 28px; height: 16px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); position: relative; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; border-radius: 999px; background: var(--bg); border: 1px solid var(--border); transition: left .15s; }
.switch-row input:checked + .switch { background: var(--accent); border-color: var(--accent); }
.switch-row input:checked + .switch::after { left: 14px; border-color: transparent; }

/* Playground */
#playground { display: flex; flex-direction: column; }
.pg-header { flex-shrink: 0; padding: 12px max(20px, calc((100% - 860px) / 2)) 10px; border-bottom: 1px solid var(--border); }
.panel { margin-top: 10px; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--sidebar); padding: 10px 14px; }
.panel .p-title { font-size: 12px; font-weight: 500; color: var(--text2); margin-bottom: 7px; }
.panel .p-err { color: var(--danger); font-size: 12px; margin-top: 6px; }
.panel textarea { width: 100%; min-height: 100px; font-family: var(--mono); font-size: 12.5px; resize: vertical; background: var(--bg); }
.p-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.p-row input { width: 170px; font-size: 12.5px; }
#promptVars { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
#promptVars:empty { display: none; }
#promptVars label { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 12px; color: var(--text2); }
#promptVars input { width: 140px; font-family: var(--mono); font-size: 12px; }

/* 对话区 */
.chat {
  flex: 1; min-height: 0; overflow-y: auto;
  display: flex; flex-direction: column; gap: 12px;
  padding: 18px max(20px, calc((100% - 860px) / 2)) 20px;
}
.chat .empty { margin: auto; color: var(--text2); font-size: 13px; }
.msg { max-width: 78%; padding: 9px 13px; border-radius: var(--radius-lg); font-size: 13.5px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
.msg.user { align-self: flex-end; background: var(--accent); color: var(--accent-contrast); }
.msg.ai { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); }
.msg.ai.err { background: none; border: 1px solid var(--danger); color: var(--danger); }
.msg pre.json { margin-top: 8px; padding: 9px 11px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); font-family: var(--mono); font-size: 12.5px; overflow-x: auto; white-space: pre; }
.msg .meta { margin-top: 8px; font-family: var(--mono); font-size: 11.5px; color: var(--text2); }
.msg .meta code { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
.msg.ai.err .meta { color: var(--danger); opacity: .8; }
.cursor { display: inline-block; width: 7px; height: 13px; margin-left: 2px; vertical-align: -2px; background: var(--text2); border-radius: 1px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* 输入条 */
.composer { flex-shrink: 0; padding: 0 max(20px, calc((100% - 860px) / 2)) 16px; }
.inputbar { display: flex; gap: 8px; align-items: flex-end; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--bg); padding: 7px 7px 7px 10px; }
.inputbar:focus-within { border-color: var(--text2); }
.inputbar textarea { flex: 1; border: none; background: none; resize: none; max-height: 140px; padding: 5px 0; }
.btn-primary { background: var(--accent); color: var(--accent-contrast); border: none; border-radius: var(--radius); padding: 7px 16px; font-size: 13px; font-weight: 500; }
.btn-primary:disabled { opacity: .4; cursor: default; }

/* Metrics */
#metrics { overflow-y: auto; padding: 20px max(20px, calc((100% - 1040px) / 2)) 32px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 24px; }
.kpi { background: var(--sidebar); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 12px 14px; }
.kpi .v { font-weight: 600; font-size: 17px; font-variant-numeric: tabular-nums; }
.kpi .l { color: var(--text2); font-size: 11.5px; margin-top: 3px; }
.sect { font-size: 11.5px; font-weight: 500; color: var(--text2); text-transform: uppercase; letter-spacing: .05em; margin: 0 0 10px; }
.mrow { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.mrow .name { font-family: var(--mono); font-size: 12.5px; width: 80px; }
.mrow .track { flex: 1; height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.mrow .fill { height: 100%; border-radius: 999px; background: var(--text2); }
.mrow .val { color: var(--text2); font-size: 11.5px; width: 230px; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th { text-align: left; color: var(--text2); font-weight: 500; font-size: 11.5px; padding: 6px 10px; border-bottom: 1px solid var(--border); }
td { padding: 7px 10px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
td.mono { font-family: var(--mono); font-size: 12px; }
tr:last-child td { border-bottom: none; }
.badge { font-size: 11.5px; font-weight: 500; border-radius: 999px; padding: 1px 8px; background: var(--surface-2); color: var(--text2); }
.badge.ok { background: none; border: 1px solid var(--border); color: var(--text2); }
.badge.ok::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); margin-right: 6px; vertical-align: 1px; }
.badge.err { background: none; border: 1px solid var(--danger); color: var(--danger); }
.m-block { margin-bottom: 24px; }
.hint { color: var(--text2); font-size: 11.5px; }

/* Prompts */
#prompts { display: flex; }
.p-layout { display: flex; width: 100%; min-height: 0; }
.p-list { width: 230px; flex-shrink: 0; overflow-y: auto; border-right: 1px solid var(--border); padding: 10px 8px; background: var(--sidebar); }
.p-group + .p-group { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
.p-name { font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; color: var(--text2); padding: 5px 8px; }
.p-ver { display: flex; align-items: center; gap: 8px; width: 100%; border: none; background: none; padding: 6px 8px; border-radius: var(--radius); font-family: var(--mono); font-size: 12.5px; text-align: left; color: var(--text2); }
.p-ver:hover { background: var(--surface); color: var(--text); }
.p-ver.sel { background: var(--surface-2); color: var(--text); }
.p-ver .latest { font-size: 10.5px; color: var(--text2); border: 1px solid var(--border); border-radius: 999px; padding: 0 6px; }
.p-main { flex: 1; overflow-y: auto; padding: 20px 24px 32px; }
.p-main .card { max-width: 760px; }
.p-detail pre { background: var(--sidebar); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap; word-break: break-word; max-height: 260px; overflow: auto; }
.card { border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px 18px; margin-bottom: 14px; }
.card h3 { font-size: 13px; font-weight: 600; margin-bottom: 12px; }
.card .row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.card input { width: 190px; }
.card textarea { width: 100%; min-height: 100px; font-family: var(--mono); font-size: 12.5px; resize: vertical; }
.form-err { color: var(--danger); font-size: 12px; margin-top: 8px; }
.form-ok { color: var(--text2); font-size: 12px; margin-top: 8px; }

@media (max-width: 760px) {
  .sidebar { width: 60px; padding: 12px 6px; }
  .brand span:not(.mark), nav button span, .side-foot span:not(.dot) { display: none; }
  .brand { justify-content: center; padding: 6px 0 16px; }
  nav button { justify-content: center; }
  .side-foot { justify-content: center; }
  .mrow .val { width: auto; }
  .p-list { width: 160px; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="mark"></span><span>MLL Gateway</span></div>
    <nav>
      <button data-tab="playground" class="active">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>Playground</span>
      </button>
      <button data-tab="metrics">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
        <span>Metrics</span>
      </button>
      <button data-tab="prompts">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        <span>Prompts</span>
      </button>
    </nav>
    <div class="side-foot"><span class="dot"></span><span id="sideHost">localhost</span></div>
  </aside>

  <div class="main">
    <div class="titlebar">
      <h1 id="tabTitle">Playground</h1>
      <span class="tb-meta">API v1</span>
    </div>

    <div class="content">
      <!-- Playground -->
      <section id="playground">
        <div class="pg-header">
          <div class="controls">
            <label class="field">模型 <select id="modelSel"></select></label>
            <label class="field" id="formatWrap">格式
              <select id="formatSel">
                <option value="text">text</option>
                <option value="json_object">json_object</option>
                <option value="json_schema">json_schema</option>
              </select>
            </label>
            <button class="chip-btn" id="promptBtn">模板引用</button>
            <label class="switch-row">流式 <input type="checkbox" id="streamToggle"><span class="switch"></span></label>
          </div>

          <div class="panel" id="schemaPanel" hidden>
            <div class="p-title">JSON Schema</div>
            <textarea id="schemaInput" spellcheck="false">{
  "type": "object",
  "properties": {
    "name": { "type": "string" },
    "age": { "type": "integer" }
  },
  "required": ["name", "age"]
}</textarea>
            <div class="p-err" id="schemaErr" hidden></div>
          </div>

          <div class="panel" id="promptPanel" hidden>
            <div class="p-title">模板引用</div>
            <div class="p-row">
              <input id="promptName" placeholder="模板名" spellcheck="false">
              <input id="promptVersion" placeholder="版本（默认 latest）" spellcheck="false">
            </div>
            <div id="promptVars"></div>
            <div class="p-err" id="promptErr" hidden></div>
          </div>
        </div>

        <div class="chat" id="chat"><div class="empty">选择模型，输入消息开始对话</div></div>

        <div class="composer">
          <div class="inputbar">
            <textarea id="input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
            <button class="btn-primary" id="sendBtn">发送</button>
          </div>
        </div>
      </section>

      <!-- Metrics -->
      <section id="metrics" hidden>
        <div class="kpis" id="kpis"></div>
        <div class="m-block">
          <div class="sect">按模型</div>
          <div id="byModel"></div>
        </div>
        <div class="m-block">
          <div class="sect">最近调用 <span class="hint" id="metricsHint"></span></div>
          <table>
            <thead><tr><th>时间</th><th>模型</th><th>类型</th><th>状态</th><th>耗时</th><th>Tokens</th><th>重试</th></tr></thead>
            <tbody id="recentBody"></tbody>
          </table>
        </div>
      </section>

      <!-- Prompts -->
      <section id="prompts" hidden>
        <div class="p-layout">
          <div class="p-list" id="promptList"></div>
          <div class="p-main">
            <div class="card p-detail" id="promptDetail" hidden>
              <h3 id="pdTitle"></h3>
              <pre id="pdTemplate"></pre>
              <div class="hint" id="pdMeta" style="margin:8px 0 12px"></div>
              <button class="btn-primary" id="pdUse">在 Playground 中使用</button>
            </div>
            <div class="card">
              <h3>发布新版本</h3>
              <div class="row">
                <input id="pubName" placeholder="模板名" spellcheck="false">
                <input id="pubVersion" placeholder="版本，如 v1" spellcheck="false">
              </div>
              <textarea id="pubTemplate" placeholder="模板正文，使用 ${变量名} 作为占位符" spellcheck="false"></textarea>
              <div class="row" style="margin-top:8px"><button class="btn-primary" id="pubBtn">发布</button></div>
              <div class="form-err" id="pubErr" hidden></div>
              <div class="form-ok" id="pubOk" hidden></div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </div>
</div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function api(path, options) {
  const resp = await fetch(path, options);
  if (!resp.ok) {
    let err;
    try { err = await resp.json(); } catch { err = { code: 'HTTP_' + resp.status, message: resp.statusText }; }
    throw Object.assign(new Error(err.message || resp.statusText), { code: err.code || 'HTTP_' + resp.status });
  }
  return resp;
}

/* ---------- Tab 导航 ---------- */
let metricsTimer = null;
const TAB_TITLES = { playground: 'Playground', metrics: 'Metrics', prompts: 'Prompts' };
function switchTab(name) {
  document.querySelectorAll('nav button').forEach((b) => b.classList.toggle('active', b.dataset.tab === name));
  ['playground', 'metrics', 'prompts'].forEach((t) => { $(t).hidden = t !== name; });
  $('tabTitle').textContent = TAB_TITLES[name] || name;
  if (metricsTimer) { clearInterval(metricsTimer); metricsTimer = null; }
  if (name === 'metrics') { loadMetrics(); metricsTimer = setInterval(loadMetrics, 5000); }
  if (name === 'prompts') loadPrompts();
}
document.querySelectorAll('nav button').forEach((b) => b.addEventListener('click', () => switchTab(b.dataset.tab)));

/* ---------- Playground ---------- */
const history = [];  // 多轮对话历史，以 messages 提交
let sending = false;

async function loadModels() {
  try {
    const data = await (await api('/models')).json();
    $('modelSel').innerHTML = data.models.map((m) => `<option value="${esc(m)}"${m === data.default ? ' selected' : ''}>${esc(m)}</option>`).join('');
  } catch {
    $('modelSel').innerHTML = '<option value="deepseek">deepseek</option><option value="minimax">minimax</option>';
  }
}

// 流式与结构化输出互斥：开流式时锁定 text
$('streamToggle').addEventListener('change', (e) => {
  const on = e.target.checked;
  $('formatSel').disabled = on;
  if (on) $('formatSel').value = 'text';
  syncFormatPanel();
});

$('formatSel').addEventListener('change', syncFormatPanel);
function syncFormatPanel() {
  $('schemaPanel').hidden = $('formatSel').value !== 'json_schema';
  $('schemaErr').hidden = true;
}

$('promptBtn').addEventListener('click', () => {
  const p = $('promptPanel');
  p.hidden = !p.hidden;
  $('promptBtn').classList.toggle('on', !p.hidden);
});

// 模板名/版本变化后拉取模板，解析 ${变量} 生成输入框
let varTimer = null;
['promptName', 'promptVersion'].forEach((id) => $(id).addEventListener('input', () => {
  clearTimeout(varTimer);
  varTimer = setTimeout(loadPromptVars, 400);
}));

async function loadPromptVars() {
  const name = $('promptName').value.trim();
  const version = $('promptVersion').value.trim() || 'latest';
  $('promptVars').innerHTML = '';
  $('promptErr').hidden = true;
  if (!name) return;
  try {
    const t = await (await api(`/prompts/${encodeURIComponent(name)}/${encodeURIComponent(version)}`)).json();
    const vars = [...new Set([...t.template.matchAll(/\$\{([^}]+)\}/g)].map((m) => m[1]))];
    $('promptVars').innerHTML = vars.map((v) => `<label>${esc(v)} <input data-var="${esc(v)}" spellcheck="false"></label>`).join('');
  } catch (e) {
    $('promptErr').textContent = `${e.code}: ${e.message}`;
    $('promptErr').hidden = false;
  }
}

function buildPayload() {
  const payload = {
    messages: [...history, { role: 'user', content: $('input').value.trim() }],
    model: $('modelSel').value,
  };
  // 模板引用：面板展开且填了模板名才带上
  if (!$('promptPanel').hidden && $('promptName').value.trim()) {
    const variables = {};
    document.querySelectorAll('#promptVars input').forEach((i) => { variables[i.dataset.var] = i.value; });
    payload.prompt = { name: $('promptName').value.trim(), version: $('promptVersion').value.trim() || 'latest', variables };
  }
  return payload;
}

function buildResponseFormat() {
  const type = $('formatSel').value;
  if (type === 'text') return { type: 'text' };
  if (type === 'json_object') return { type: 'json_object' };
  let schema;
  try {
    schema = JSON.parse($('schemaInput').value);
    $('schemaErr').hidden = true;
  } catch (e) {
    $('schemaErr').textContent = 'Schema 不是合法 JSON：' + e.message;
    $('schemaErr').hidden = false;
    throw e;
  }
  return { type: 'json_schema', json_schema: { name: 'response', strict: true, schema } };
}

function addBubble(role, html) {
  const empty = $('chat').querySelector('.empty');
  if (empty) empty.remove();
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = html;
  $('chat').appendChild(div);
  div.scrollIntoView({ block: 'nearest' });
  return div;
}

function metaLine(parts) {
  return `<div class="meta">${parts.filter(Boolean).join(' · ')}</div>`;
}

function usageText(u) {
  return u ? `${u.prompt} in / ${u.completion} out` : null;
}

async function sendMessage() {
  const text = $('input').value.trim();
  if (!text || sending) return;
  let payload;
  try {
    payload = buildPayload();
    if (!$('streamToggle').checked) payload.response_format = buildResponseFormat();
  } catch { return; }  // schema 校验失败，错误已展示

  sending = true;
  $('sendBtn').disabled = true;
  $('input').value = '';
  $('input').style.height = 'auto';
  addBubble('user', esc(text));

  const stream = $('streamToggle').checked;
  try {
    if (stream) await sendStream(payload);
    else await sendComplete(payload);
    history.push({ role: 'user', content: text });
  } catch (e) {
    addBubble('ai err', `${esc(e.code)}: ${esc(e.message)}`);
  } finally {
    sending = false;
    $('sendBtn').disabled = false;
    $('input').focus();
  }
}

async function sendComplete(payload) {
  const data = await (await api('/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  })).json();
  let html = esc(data.reply);
  if (data.data !== null && data.data !== undefined) {
    html += `<pre class="json">${esc(JSON.stringify(data.data, null, 2))}</pre>`;
  }
  html += metaLine([
    esc(data.model),
    (data.latency_ms / 1000).toFixed(2) + 's',
    usageText(data.usage),
    data.attempts > 1 ? `重试 ${data.attempts - 1}` : null,
    `<code>${esc(data.request_id.slice(0, 8))}</code>`,
  ]);
  addBubble('ai', html);
  history.push({ role: 'assistant', content: data.reply });
}

// POST 形式的 SSE：fetch + ReadableStream 手动分帧
async function sendStream(payload) {
  const resp = await api('/stream', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  const bubble = addBubble('ai', '<span class="txt"></span><span class="cursor"></span>');
  const txt = bubble.querySelector('.txt');
  let reply = '';
  let done = null;

  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buf = '';
  for (;;) {
    const { done: finished, value } = await reader.read();
    if (finished) break;
    buf += decoder.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf('\n\n')) >= 0) {
      const frame = buf.slice(0, idx);
      buf = buf.slice(idx + 2);
      for (const line of frame.split('\n')) {
        if (!line.startsWith('data: ')) continue;
        const raw = line.slice(6);
        if (raw === '[DONE]') continue;
        const ev = JSON.parse(raw);
        if (ev.type === 'content.delta') {
          reply += ev.delta;
          txt.textContent = reply;
          bubble.scrollIntoView({ block: 'nearest' });
        } else if (ev.type === 'response.completed') {
          done = ev;
        } else if (ev.type === 'response.failed') {
          throw Object.assign(new Error(ev.error.message), { code: ev.error.code });
        }
      }
    }
  }
  bubble.querySelector('.cursor')?.remove();
  if (done) {
    bubble.insertAdjacentHTML('beforeend', metaLine([
      esc(done.model),
      (done.latency_ms / 1000).toFixed(2) + 's',
      usageText(done.usage),
      `<code>${esc(done.request_id.slice(0, 8))}</code>`,
    ]));
  }
  history.push({ role: 'assistant', content: reply });
}

$('sendBtn').addEventListener('click', sendMessage);
$('input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
$('input').addEventListener('input', (e) => {
  e.target.style.height = 'auto';
  e.target.style.height = Math.min(e.target.scrollHeight, 140) + 'px';
});

/* ---------- Metrics ---------- */
const fmtMs = (ms) => (ms === null || ms === undefined ? '—' : (ms / 1000).toFixed(2) + 's');
const fmtInt = (n) => (n >= 10000 ? (n / 1000).toFixed(1) + 'k' : String(n));

async function loadMetrics() {
  let m;
  try {
    m = await (await api('/metrics')).json();
  } catch {
    return;
  }
  const t = m.total;
  const rate = t.calls.total ? ((t.calls.success / t.calls.total) * 100).toFixed(1) + '%' : '—';
  $('kpis').innerHTML = [
    [fmtInt(t.calls.total), '总调用'],
    [rate, '成功率'],
    [fmtInt(t.tokens.total), 'Tokens'],
    [fmtMs(t.latency_ms.avg), '平均延迟'],
    [fmtMs(t.first_token_ms.avg), '平均首 Token'],
    ['$' + t.cost_usd.toFixed(4), '累计成本'],
  ].map(([v, l]) => `<div class="kpi"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('');

  const models = Object.entries(m.by_model);
  const maxCalls = Math.max(1, ...models.map(([, a]) => a.calls.total));
  $('byModel').innerHTML = models.length ? models.map(([name, a]) => `
    <div class="mrow">
      <span class="name">${esc(name)}</span>
      <span class="track"><span class="fill" style="display:block;width:${Math.round((a.calls.total / maxCalls) * 100)}%"></span></span>
      <span class="val">${a.calls.total} 次 · 平均 ${fmtMs(a.latency_ms.avg)} · 首 token ${fmtMs(a.first_token_ms.avg)}</span>
    </div>`).join('') : '<div class="hint">暂无数据</div>';

  const recent = [...m.recent].reverse();
  $('recentBody').innerHTML = recent.length ? recent.map((r) => `
    <tr>
      <td class="mono">${new Date(r.timestamp).toLocaleTimeString('zh-CN', { hour12: false })}</td>
      <td class="mono">${esc(r.model)}</td>
      <td><span class="badge">${r.stream ? 'stream' : 'chat'}</span></td>
      <td>${r.success ? '<span class="badge ok">成功</span>' : `<span class="badge err">${esc(r.error_code || '失败')}</span>`}</td>
      <td class="mono">${fmtMs(r.latency_ms)}${r.first_token_ms != null ? ` · 首 ${fmtMs(r.first_token_ms)}` : ''}</td>
      <td class="mono">${r.tokens ? r.tokens.total : '—'}</td>
      <td class="mono">${r.retries || ''}</td>
    </tr>`).join('') : '<tr><td colspan="7" class="hint">暂无调用</td></tr>';
  $('metricsHint').textContent = '每 5s 自动刷新';
}

/* ---------- Prompts ---------- */
let selectedPrompt = null;  // {name, version, template}

async function loadPrompts() {
  let list;
  try {
    list = await (await api('/prompts')).json();
  } catch (e) {
    $('promptList').innerHTML = `<div class="p-name">${esc(e.code)}: ${esc(e.message)}</div>`;
    return;
  }
  if (!list.length) {
    $('promptList').innerHTML = '<div class="p-name">暂无模板</div>';
    return;
  }
  const groups = {};
  for (const t of list) (groups[t.name] ||= []).push(t);
  $('promptList').innerHTML = Object.entries(groups).map(([name, vers]) => `
    <div class="p-group">
      <div class="p-name">${esc(name)}</div>
      ${vers.map((t) => `
        <button class="p-ver" data-name="${esc(name)}" data-version="${esc(t.version)}">
          ${esc(t.version)}${t.is_latest ? '<span class="latest">latest</span>' : ''}
        </button>`).join('')}
    </div>`).join('');
  $('promptList').querySelectorAll('.p-ver').forEach((b) =>
    b.addEventListener('click', () => showPrompt(b.dataset.name, b.dataset.version)));
}

async function showPrompt(name, version) {
  try {
    const t = await (await api(`/prompts/${encodeURIComponent(name)}/${encodeURIComponent(version)}`)).json();
    selectedPrompt = t;
    $('promptList').querySelectorAll('.p-ver').forEach((b) =>
      b.classList.toggle('sel', b.dataset.name === name && b.dataset.version === version));
    $('promptDetail').hidden = false;
    $('pdTitle').textContent = `${t.name}@${t.version}`;
    $('pdTemplate').textContent = t.template;
    $('pdMeta').textContent = `发布于 ${new Date(t.created_at).toLocaleString('zh-CN')}${t.is_latest ? ' · 最新版本' : ''}`;
  } catch (e) {
    $('promptDetail').hidden = true;
    alert(`${e.code}: ${e.message}`);
  }
}

$('pdUse').addEventListener('click', () => {
  if (!selectedPrompt) return;
  switchTab('playground');
  $('promptPanel').hidden = false;
  $('promptBtn').classList.add('on');
  $('promptName').value = selectedPrompt.name;
  $('promptVersion').value = selectedPrompt.version;
  loadPromptVars();
});

$('pubBtn').addEventListener('click', async () => {
  $('pubErr').hidden = true;
  $('pubOk').hidden = true;
  const body = {
    name: $('pubName').value.trim(),
    version: $('pubVersion').value.trim(),
    template: $('pubTemplate').value,
  };
  try {
    const t = await (await api('/prompts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    })).json();
    $('pubOk').textContent = `已发布 ${t.name}@${t.version}`;
    $('pubOk').hidden = false;
    $('pubVersion').value = '';
    await loadPrompts();
    showPrompt(t.name, t.version);
  } catch (e) {
    $('pubErr').textContent = `${e.code}: ${e.message}`;
    $('pubErr').hidden = false;
  }
});

/* ---------- 启动 ---------- */
if (navigator.userAgent.includes('Electron')) document.body.classList.add('is-electron');
$('sideHost').textContent = location.host || 'localhost';
loadModels();
$('input').focus();
</script>
